[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swob_to_json"
version = "1.1.0"
description = "Convert SWOB-ML XML weather observations to JSON"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nate Rosenstock"}
]
keywords = ["swob", "weather", "xml", "json", "eccc", "meteorology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "click>=7.0",
    "xmltodict>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[project.scripts]
swob-to-json = "swob_to_json.__main__:main"

[project.urls]
Homepage = "https://github.com/cioos-siooc/swob-to-json"
Repository = "https://github.com/cioos-siooc/swob-to-json"
Issues = "https://github.com/cioos-siooc/swob-to-json/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "test_files*"]

[tool.setuptools.package-data]
swob_to_json = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
